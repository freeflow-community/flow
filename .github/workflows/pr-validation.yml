name: Apple client validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-clients:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compile macOS client and run message-delete policy tests
        working-directory: apps/macos
        run: swift test --filter MessageDeletePolicyTests

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iOS project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Compile iOS client for Simulator
        working-directory: apps/ios
        run: >-
          xcodebuild
          -project FlowiOS.xcodeproj
          -scheme Flow
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build
          CODE_SIGNING_ALLOWED=NO
          build
