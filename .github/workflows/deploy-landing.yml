# Deploy the marketing site (flowlandingpage/) to Cloudflare Pages. Runs on
# any push to main that touches the site. The site is a static Next.js export
# (`out/`) — no server, so Pages just serves files.
#
# One-time Cloudflare setup (see BUILD.md):
#   - Pages project "freeflow-landing", custom domains freeflow.im + www
#   - Repo secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit),
#     CLOUDFLARE_ACCOUNT_ID
name: deploy-landing

on:
  push:
    branches: [main]
    paths:
      - 'flowlandingpage/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      # --ignore-workspace: the site is standalone, not part of the repo's
      # pnpm workspace (packages/*); the flag keeps its lockfile local.
      - name: Install
        working-directory: flowlandingpage
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Build (static export)
        working-directory: flowlandingpage
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy flowlandingpage/out --project-name=freeflow-landing
