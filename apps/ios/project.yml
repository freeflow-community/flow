name: FlowiOS
options:
  bundleIdPrefix: im.freeflow
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
targets:
  Flow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Reuse the macOS app's platform-agnostic layers (data model, API/socket,
    # GRDB cache, SyncEngine, AppState, cross-platform Support helpers).
    # AppKit-tainted files (ImageLoader, Banners, macOS App entry, all Views)
    # are excluded and reimplemented for iOS under Sources/.
    sources:
      - path: Sources
      - path: ../macos/Sources/Flow/Models
      - path: ../macos/Sources/Flow/Networking
        excludes: [ImageLoader.swift]
      - path: ../macos/Sources/Flow/Database
      - path: ../macos/Sources/Flow/Sync
      - path: ../macos/Sources/Flow/App/AppState.swift
      - path: ../macos/Sources/Flow/App/WindowState.swift
      - path: ../macos/Sources/Flow/Support
        # Updater.swift is Sparkle (macOS-only auto-update); iOS ships through
        # the App Store and has no Sparkle dependency, so compiling it here
        # fails on the missing module.
        excludes: [Banners.swift, Updater.swift]
    dependencies:
      - package: GRDB
    # Sign in with Apple. XcodeGen writes the entitlements file; the App ID's
    # capability must also be enabled in the developer portal (automatic
    # signing handles this when archiving in Xcode).
    entitlements:
      path: Sources/Flow.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Sources/Generated-Info.plist
      properties:
        FlowServerURL: https://app.freeflow.im
        CFBundleDisplayName: Flow
        # Version + build come from the MARKETING_VERSION / CURRENT_PROJECT_VERSION
        # build settings below. Without these, XcodeGen writes literal "1.0"/"1"
        # into the plist, which override the settings and pin every archive to
        # 1.0 (1) — bump CURRENT_PROJECT_VERSION per TestFlight upload.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Register flow:// so the web-to-app handoff (flow://signin?code=…) and
        # invite links (flow://invite/…) open the app — the intended way to
        # sign in on a phone.
        CFBundleURLTypes:
          - CFBundleURLName: im.freeflow.app
            CFBundleURLSchemes: [flow]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Take a photo to share in the conversation.
        ITSAppUsesNonExemptEncryption: false
        # Allow cleartext HTTP only to loopback/.local (dev server); prod
        # (app.freeflow.im) stays HTTPS-enforced under ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.freeflow.app
        DEVELOPMENT_TEAM: RP5QYMYA4Z # App Store signing team (clean 2026-07 account)
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "20"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Device builds need a signing team (set it in Xcode → Signing &
        # Capabilities, or via DEVELOPMENT_TEAM). Simulator CLI builds pass
        # CODE_SIGNING_ALLOWED=NO on the xcodebuild invocation instead, so the
        # committed project stays device-ready by default.

  # XCUITest target: taps happen inside the simulator, so iOS UI checks don't
  # need the operator's desktop the way the macOS AX harness does. Runs against
  # a local dev server + `qa-seed.mjs` fixtures — see UITests/README.md.
  FlowUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Flow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.freeflow.app.uitests
        DEVELOPMENT_TEAM: RP5QYMYA4Z
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Flow

schemes:
  Flow:
    build:
      targets:
        Flow: all
        FlowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FlowUITests]
