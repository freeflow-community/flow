<svg width="820" height="480" viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="480" rx="16" fill="#F8FAFC"/>
  <text x="40" y="52" font-size="22" font-weight="bold" fill="#0F172A">Flow &#8212; workspace unread badges</text>
  <text x="40" y="78" font-size="14" fill="#64748B">Sidebar workspace icons show the count of unread messages in that workspace</text>
  <rect x="40" y="104" width="76" height="336" rx="14" fill="#1E293B"/>
  <rect x="36" y="122" width="4" height="40" rx="2" fill="#FFFFFF"/>
  <rect x="54" y="118" width="48" height="48" rx="12" fill="#6366F1"/>
  <text x="78" y="150" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">F</text>
  <rect x="54" y="186" width="48" height="48" rx="12" fill="#0EA5E9"/>
  <text x="78" y="218" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text>
  <circle cx="102" cy="188" r="12" fill="#F04438" stroke="#1E293B" stroke-width="2.5"/>
  <text x="102" y="193" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <rect x="54" y="254" width="48" height="48" rx="12" fill="#10B981"/>
  <text x="78" y="286" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B</text>
  <rect x="86" y="244" width="34" height="24" rx="12" fill="#F04438" stroke="#1E293B" stroke-width="2.5"/>
  <text x="103" y="261" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">99+</text>
  <rect x="54" y="322" width="48" height="48" rx="12" fill="#F59E0B"/>
  <text x="78" y="354" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">D</text>
  <rect x="54" y="390" width="48" height="48" rx="12" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="78" y="421" font-size="22" fill="#64748B" text-anchor="middle">+</text>
  <line x1="118" y1="188" x2="220" y2="168" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="124" y1="256" x2="220" y2="252" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="106" y1="346" x2="220" y2="336" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="230" y="160" font-size="15" font-weight="bold" fill="#0F172A">Unread count badge</text>
  <text x="230" y="182" font-size="13" fill="#475569">Total unread messages across the workspace&#39;s channels.</text>
  <text x="230" y="200" font-size="13" fill="#475569">Red #F04438, white bold text, top-right of the icon,</text>
  <text x="230" y="218" font-size="13" fill="#475569">2.5px ring in the rail background color.</text>
  <text x="230" y="250" font-size="15" font-weight="bold" fill="#0F172A">Caps at 99+</text>
  <text x="230" y="272" font-size="13" fill="#475569">Badge widens to a pill for 2-3 digits; never wider than 99+.</text>
  <text x="230" y="334" font-size="15" font-weight="bold" fill="#0F172A">No unread, no badge</text>
  <text x="230" y="356" font-size="13" fill="#475569">Badge is hidden entirely at zero; it never shows 0.</text>
  <text x="230" y="404" font-size="15" font-weight="bold" fill="#0F172A">Live updates</text>
  <text x="230" y="426" font-size="13" fill="#475569">Count updates in real time as messages arrive and as</text>
  <text x="230" y="444" font-size="13" fill="#475569">channels are read, without reloading.</text>
</svg>